name: Publish ETCL Pages manually
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter PUBLISH English-Audio-ETCL
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: etcl-pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirmation == 'PUBLISH English-Audio-ETCL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
